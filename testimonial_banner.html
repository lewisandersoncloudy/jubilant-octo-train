<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testimonial Banner – Lewis Anderson Enterprises</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&family=Merriweather:ital,wght@0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold:      #d4a017;
      --gold-dim:  rgba(212, 160, 23, 0.35);
      --banner-h:  118px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Banner ── */
    .testimonial-banner {
      width: 100%;
      height: var(--banner-h);
      background: rgba(20, 36, 58, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-top: 1px solid var(--gold);
      border-bottom: 1px solid var(--gold);
      overflow: hidden;
      position: relative;
      -webkit-mask-image: linear-gradient(
        to right, transparent 0%, black 5%, black 95%, transparent 100%
      );
      mask-image: linear-gradient(
        to right, transparent 0%, black 5%, black 95%, transparent 100%
      );
    }

    .track-wrapper {
      display: flex;
      align-items: center;
      height: 100%;
      overflow: hidden;
    }

    .track {
      display: flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
      animation: scroll-left 60s linear infinite;
    }

    .track:hover {
      animation-play-state: paused;
    }

    .quote-card {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 3rem;
      border-right: 1px solid var(--gold-dim);
      min-width: 320px;
      max-width: 500px;
      flex-shrink: 0;
      gap: 4px;
    }

    .quote-star {
      font-size: 0.72rem;
      color: var(--gold);
      letter-spacing: 4px;
    }

    .quote-text {
      font-family: 'Merriweather', Georgia, serif;
      font-style: italic;
      font-size: clamp(0.8rem, 1.35vw, 0.92rem);
      color: #ffffff;
      line-height: 1.5;
      white-space: normal;
    }

    .quote-text::before {
      content: '\201C';
      color: var(--gold);
      font-size: 1.25em;
      line-height: 0;
      vertical-align: -0.22em;
      margin-right: 1px;
    }

    .quote-text::after {
      content: '\201D';
      color: var(--gold);
      font-size: 1.25em;
      line-height: 0;
      vertical-align: -0.22em;
      margin-left: 1px;
    }

    .quote-course {
      font-family: 'Lato', 'Segoe UI', sans-serif;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.9;
      white-space: normal;
    }

    @keyframes scroll-left {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
  </style>
</head>
<body>

  <div class="testimonial-banner" role="region" aria-label="Client testimonials">
    <div class="track-wrapper">
      <div class="track" id="quoteTrack"></div>
    </div>
  </div>

  <script>
    const AI_COURSE  = "A Clerk & Councillor's Introduction to Artificial Intelligence";
    const AGAR_COURSE = "Taking the \u2018GRRR\u2019 out of AGAR: Financial Year End Prep for Town & Parish Councils";

    const quotes = [
      { text: "Great course, will definitely start using for agenda setting and minute taking.", course: AI_COURSE },
      { text: "Thank you again for a very informative session.", course: AGAR_COURSE },
      { text: "Very well presented and informative.", course: AI_COURSE },
      { text: "Clear format, especially useful on Assertion 10.", course: AGAR_COURSE },
      { text: "A subject I have avoided, brought to life.", course: AI_COURSE },
      { text: "Great to have training from someone who actually works in the sector day to day.", course: AGAR_COURSE },
      { text: "Really enjoyed the seminar\u2026 it\u2019s a new world. Thanks for the opportunity.", course: AI_COURSE },
      { text: "Don\u2019t feel like a luddite now.", course: AI_COURSE },
    ];

    function buildCard({ text, course }) {
      const card = document.createElement('div');
      card.className = 'quote-card';
      card.innerHTML = `
        <span class="quote-star" aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9733;</span>
        <span class="quote-text">${text}</span>
        <span class="quote-course">${course}</span>
      `;
      return card;
    }

    const track = document.getElementById('quoteTrack');
    [...quotes, ...quotes].forEach(q => track.appendChild(buildCard(q)));

    function calibrateSpeed() {
      const pxPerSec = 55;
      const dur = (track.scrollWidth / 2) / pxPerSec;
      track.style.animationDuration = dur.toFixed(1) + 's';
    }

    calibrateSpeed();
    window.addEventListener('resize', calibrateSpeed);
  </script>
</body>
</html>
