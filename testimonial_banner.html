<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testimonial Banner – Lewis Anderson Enterprises</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&family=Merriweather:ital,wght@0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand-dark:   #1a2e4a;
      --brand-mid:    #2c5282;
      --brand-accent: #d4a017;
      --text-light:   #f0f4f8;
      --text-muted:   #a0aec0;
      --banner-h:     120px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Minimal body — remove when embedding into your site */
    body {
      background: #f5f5f5;
      font-family: 'Lato', 'Segoe UI', Tahoma, sans-serif;
    }

    /* ── Banner ── */
    .testimonial-banner {
      width: 100%;
      height: var(--banner-h);
      background: linear-gradient(135deg, var(--brand-dark) 0%, var(--brand-mid) 100%);
      border-top: 3px solid var(--brand-accent);
      border-bottom: 3px solid var(--brand-accent);
      overflow: hidden;
      position: relative;
      -webkit-mask-image: linear-gradient(
        to right, transparent 0%, black 6%, black 94%, transparent 100%
      );
      mask-image: linear-gradient(
        to right, transparent 0%, black 6%, black 94%, transparent 100%
      );
    }

    .track-wrapper {
      display: flex;
      align-items: center;
      height: 100%;
      overflow: hidden;
    }

    .track {
      display: flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
      animation: scroll-left 60s linear infinite;
    }

    .track:hover {
      animation-play-state: paused;
    }

    .quote-card {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 3rem;
      border-right: 1px solid rgba(212, 160, 23, 0.3);
      min-width: 320px;
      max-width: 480px;
      flex-shrink: 0;
      gap: 5px;
    }

    .quote-text {
      font-family: 'Merriweather', Georgia, serif;
      font-style: italic;
      font-size: clamp(0.78rem, 1.3vw, 0.9rem);
      color: var(--text-light);
      line-height: 1.55;
      white-space: normal;
    }

    .quote-text::before {
      content: '\201C';
      color: var(--brand-accent);
      font-size: 1.3em;
      line-height: 0;
      vertical-align: -0.25em;
      margin-right: 1px;
    }

    .quote-text::after {
      content: '\201D';
      color: var(--brand-accent);
      font-size: 1.3em;
      line-height: 0;
      vertical-align: -0.25em;
      margin-left: 1px;
    }

    .quote-course {
      font-family: 'Lato', 'Segoe UI', sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--brand-accent);
      opacity: 0.85;
      white-space: normal;
      text-align: center;
    }

    .quote-star {
      font-size: 0.7rem;
      color: var(--brand-accent);
      letter-spacing: 3px;
      text-align: center;
    }

    @keyframes scroll-left {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
  </style>
</head>
<body>

  <div class="testimonial-banner" role="region" aria-label="Client testimonials">
    <div class="track-wrapper">
      <div class="track" id="quoteTrack"></div>
    </div>
  </div>

  <script>
    const AI_COURSE  = "A Clerk & Councillor's Introduction to Artificial Intelligence";
    const AGAR_COURSE = "Taking the \u2018GRRR\u2019 out of AGAR: Financial Year End Prep for Town & Parish Councils";

    const quotes = [
      { text: "Great course, will definitely start using for agenda setting and minute taking.", course: AI_COURSE },
      { text: "Thank you again for a very informative session.", course: AGAR_COURSE },
      { text: "Very well presented and informative.", course: AI_COURSE },
      { text: "Clear format, especially useful on Assertion 10.", course: AGAR_COURSE },
      { text: "A subject I have avoided, brought to life.", course: AI_COURSE },
      { text: "Great to have training from someone who actually works in the sector day to day.", course: AGAR_COURSE },
      { text: "Really enjoyed the seminar\u2026 it\u2019s a new world. Thanks for the opportunity.", course: AI_COURSE },
      { text: "Don\u2019t feel like a luddite now.", course: AI_COURSE },
    ];

    function buildCard({ text, course }) {
      const card = document.createElement('div');
      card.className = 'quote-card';
      card.innerHTML = `
        <span class="quote-star" aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9733;</span>
        <span class="quote-text">${text}</span>
        <span class="quote-course">${course}</span>
      `;
      return card;
    }

    const track = document.getElementById('quoteTrack');
    [...quotes, ...quotes].forEach(q => track.appendChild(buildCard(q)));

    function calibrateSpeed() {
      const pxPerSec = 55;
      const dur = (track.scrollWidth / 2) / pxPerSec;
      track.style.animationDuration = dur.toFixed(1) + 's';
    }

    calibrateSpeed();
    window.addEventListener('resize', calibrateSpeed);
  </script>
</body>
</html>
