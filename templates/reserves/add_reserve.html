{% extends 'base.html' %}
{% block title %}Add Reserve{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="cf-page-title mb-3">Add Reserve</h2>
    <div class="card">
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="name">Reserve name <span class="text-danger">*</span></label>
            <input type="text" id="name" name="name" class="form-control"
                   placeholder="e.g. Election Reserve" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="description">Description</label>
            <textarea id="description" name="description" class="form-control" rows="2"
                      placeholder="e.g. Held to fund the next scheduled parish election"></textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Create Reserve</button>
            <a href="{{ url_for('reserves.index') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
