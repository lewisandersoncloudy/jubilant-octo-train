{% extends 'base.html' %}
{% block title %}Add Accrual{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <h2 class="cf-page-title mb-3">Add Accrual / Prepayment — {{ fy.label }}</h2>
    <div class="card">
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="accrual_type">Type <span class="text-danger">*</span></label>
            <select id="accrual_type" name="accrual_type" class="form-select" required>
              <option value="">— select type —</option>
              {% for type_key, type_label in accrual_types %}
              <option value="{{ type_key }}" {% if form.get('accrual_type', '') == type_key %}selected{% endif %}>
                {{ type_label }}
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label" for="description">Description <span class="text-danger">*</span></label>
            <input type="text" id="description" name="description" class="form-control"
                   value="{{ form.get('description', '') }}" required>
          </div>

          <div class="row g-3">
            <div class="col-sm-4">
              <label class="form-label" for="date">Date <span class="text-danger">*</span></label>
              <input type="date" id="date" name="date" class="form-control"
                     value="{{ form.get('date', '') }}" required>
            </div>
            <div class="col-sm-4">
              <label class="form-label" for="amount">Amount (£) <span class="text-danger">*</span></label>
              <input type="number" id="amount" name="amount" class="form-control"
                     step="0.01" min="0.01" value="{{ form.get('amount', '') }}" required>
            </div>
            <div class="col-sm-4">
              <label class="form-label" for="counterparty">Counterparty</label>
              <input type="text" id="counterparty" name="counterparty" class="form-control"
                     value="{{ form.get('counterparty', '') }}">
            </div>
          </div>

          <div class="mt-3">
            <label class="form-label" for="budget_heading_id">Budget heading</label>
            <select id="budget_heading_id" name="budget_heading_id" class="form-select">
              <option value="">— none —</option>
              {% for h in headings %}
              <option value="{{ h.id }}" {% if form.get('budget_heading_id', '') == h.id|string %}selected{% endif %}>
                {{ h.name }}
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">Save Accrual</button>
            <a href="{{ url_for('accruals.index') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
