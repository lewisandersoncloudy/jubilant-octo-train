{% extends 'base.html' %}
{% block title %}New Financial Year{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="cf-page-title mb-3">New Financial Year</h2>
    <div class="card">
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="label">Label <span class="text-danger">*</span></label>
            <input type="text" id="label" name="label" class="form-control"
                   value="{{ form.get('label', '') }}" placeholder="e.g. 2026/27" required>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label class="form-label" for="start_date">Start date <span class="text-danger">*</span></label>
              <input type="date" id="start_date" name="start_date" class="form-control"
                     value="{{ form.get('start_date', '') }}" required>
            </div>
            <div class="col-sm-6">
              <label class="form-label" for="end_date">End date <span class="text-danger">*</span></label>
              <input type="date" id="end_date" name="end_date" class="form-control"
                     value="{{ form.get('end_date', '') }}" required>
            </div>
          </div>
          <div class="mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="make_current" id="makeCurrent" value="1">
              <label class="form-check-label" for="makeCurrent">Make this the current year</label>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Create</button>
            <a href="{{ url_for('financial_years.index') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
